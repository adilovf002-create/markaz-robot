name: Markaz robot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markaz-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund playwright-core@1
      - name: Robot
        env:
          MARKAZ_KOD: ${{ secrets.MARKAZ_KOD }}
          CHROME: /usr/bin/google-chrome
        run: node robot.js
      - name: Jadval oʻchib qolmasligi uchun (oyiga bir marta)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "markaz-robot"
            git config user.email "robot@users.noreply.github.com"
            date -u +%F > tirik.txt
            git add tirik.txt
            git commit -m "Robot tirik: $(date -u +%F)"
            git push
          fi
